<!doctype html>
<html lang="pt_BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ingresso</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <form>
      <fieldset>
        <div class="container">
          <h1>Venda de Ingresso</h1>
          <div class="mb-3">
            <label for="floatingInput" class="form-label">Nome</label>
            <input type="text" name="nome" class="form-control" />
          </div>
          <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              aria-describedby="emailHelp"
            />
          </div>
          <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label">Senha</label>
            <input type="password" class="form-control" />
          </div>
          <div class="mb-3 form-check">
            <input
              type="checkbox"
              class="form-check-input"
              id="exampleCheck1"
            />
            <label class="form-check-label" for="exampleCheck1"
              >Estudante?</label
            >
          </div>
          <div class="mb-3">
            <select class="form-select" aria-label="Default select example">
              <option selected>Escolha o setor da Arquibancada</option>
              <option value="A">Setor A</option>
              <option value="B">Setor B</option>
              <option value="C">Setor C</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="formFile" class="form-label"
              >Envie uma foto para fabricação do crachá</label
            >
            <input class="form-control" type="file" id="formFile" />
          </div>

          <div class="mb-3">
            <label for="exampleColorInput" class="form-label"
              >Ao comprar um ingresso você receberá uma camiseta como brinde!
              Escolha a cor abaixo:</label
            >
            <input
              type="color"
              class="form-control form-control-color"
              id="ColorInput"
              value="#563d7c"
              title="Escolha a cor da camiseta"
            />
          </div>

          <input type="submit" class="btn btn-primary" value="Salvar" />
          <input type="reset" value="Limpar" class="btn btn-primary" />
        </div>
      </fieldset>
    </form>
  </body>
</html>
