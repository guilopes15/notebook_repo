<!doctype html>
<html lang="pt_BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <title>Document</title>
  </head>
  <body>
    <h1>Formularios</h1>
    <select class="form-select" multiple aria-label="Multiple select example">
      <option selected>Open this select menu</option>
      <option value="1">One</option>
      <option value="2">Two</option>
      <option value="3">Three</option>
    </select>

    <br />
    <br />

    <select class="form-select" size="3" aria-label="Size 3 select example">
      <option selected>Open this select menu</option>
      <option value="1">One</option>
      <option value="2">Two</option>
      <option value="3">Three</option>
    </select>

    <br />
    <br />

    <select class="form-select" aria-label="Disabled select example" disabled>
      <option selected>Open this select menu</option>
      <option value="1">One</option>
      <option value="2">Two</option>
      <option value="3">Three</option>
    </select>

    <br />
    <br />

    <label for="exampleDataList" class="form-label">Datalist example</label>
    <input
      class="form-control"
      list="datalistOptions"
      id="exampleDataList"
      placeholder="Type to search..."
    />
    <datalist id="datalistOptions">
      <option value="San Francisco"></option>
      <option value="New York"></option>
      <option value="Seattle"></option>
      <option value="Los Angeles"></option>
      <option value="Chicago"></option>
    </datalist>

    <br />
    <br />

    <h1>Checkbox</h1>
    <div class="form-check">
      <input
        class="form-check-input"
        type="checkbox"
        value=""
        id="checkDefault"
      />
      <label class="form-check-label" for="checkDefault">
        Default checkbox
      </label>
    </div>
    <div class="form-check">
      <input
        class="form-check-input"
        type="checkbox"
        value=""
        id="checkChecked"
        checked
      />
      <label class="form-check-label" for="checkChecked">
        Checked checkbox
      </label>
    </div>

    <br />
    <br />

    <div class="form-check">
      <input
        class="form-check-input"
        type="checkbox"
        value=""
        id="checkIndeterminateDisabled"
        disabled
      />
      <label class="form-check-label" for="checkIndeterminateDisabled">
        Disabled indeterminate checkbox
      </label>
    </div>
    <div class="form-check">
      <input
        class="form-check-input"
        type="checkbox"
        value=""
        id="checkDisabled"
        disabled
      />
      <label class="form-check-label" for="checkDisabled">
        Disabled checkbox
      </label>
    </div>
    <div class="form-check">
      <input
        class="form-check-input"
        type="checkbox"
        value=""
        id="checkCheckedDisabled"
        checked
        disabled
      />
      <label class="form-check-label" for="checkCheckedDisabled">
        Disabled checked checkbox
      </label>
    </div>

    <br />
    <br />
    <div class="form-check">
      <input
        class="form-check-input"
        type="radio"
        name="radioDefault"
        id="radioDefault1"
      />
      <label class="form-check-label" for="radioDefault1">
        Default radio
      </label>
    </div>
    <div class="form-check">
      <input
        class="form-check-input"
        type="radio"
        name="radioDefault"
        id="radioDefault2"
        checked
      />
      <label class="form-check-label" for="radioDefault2">
        Default checked radio
      </label>
    </div>

    <br />
    <br />
    <div class="form-check form-switch">
      <input
        class="form-check-input"
        type="checkbox"
        role="switch"
        id="switchCheckDefault"
      />
      <label class="form-check-label" for="switchCheckDefault"
        >Default switch checkbox input</label
      >
    </div>
    <div class="form-check form-switch">
      <input
        class="form-check-input"
        type="checkbox"
        role="switch"
        id="switchCheckChecked"
        checked
      />
      <label class="form-check-label" for="switchCheckChecked"
        >Checked switch checkbox input</label
      >
    </div>
    <div class="form-check form-switch">
      <input
        class="form-check-input"
        type="checkbox"
        role="switch"
        id="switchCheckDisabled"
        disabled
      />
      <label class="form-check-label" for="switchCheckDisabled"
        >Disabled switch checkbox input</label
      >
    </div>
    <div class="form-check form-switch">
      <input
        class="form-check-input"
        type="checkbox"
        role="switch"
        id="switchCheckCheckedDisabled"
        checked
        disabled
      />
      <label class="form-check-label" for="switchCheckCheckedDisabled"
        >Disabled checked switch checkbox input</label
      >
    </div>

    <br />
    <br />

    <div class="form-check form-check-inline">
      <input
        class="form-check-input"
        type="checkbox"
        id="inlineCheckbox1"
        value="option1"
      />
      <label class="form-check-label" for="inlineCheckbox1">1</label>
    </div>
    <div class="form-check form-check-inline">
      <input
        class="form-check-input"
        type="checkbox"
        id="inlineCheckbox2"
        value="option2"
      />
      <label class="form-check-label" for="inlineCheckbox2">2</label>
    </div>
    <div class="form-check form-check-inline">
      <input
        class="form-check-input"
        type="checkbox"
        id="inlineCheckbox3"
        value="option3"
        disabled
      />
      <label class="form-check-label" for="inlineCheckbox3">3 (disabled)</label>
    </div>

    <br />
    <br />

    <div class="form-check form-check-reverse">
      <input
        class="form-check-input"
        type="checkbox"
        value=""
        id="reverseCheck1"
      />
      <label class="form-check-label" for="reverseCheck1">
        Reverse checkbox
      </label>
    </div>
    <div class="form-check form-check-reverse">
      <input
        class="form-check-input"
        type="checkbox"
        value=""
        id="reverseCheck2"
        disabled
      />
      <label class="form-check-label" for="reverseCheck2">
        Disabled reverse checkbox
      </label>
    </div>

    <div class="form-check form-switch form-check-reverse">
      <input class="form-check-input" type="checkbox" id="switchCheckReverse" />
      <label class="form-check-label" for="switchCheckReverse"
        >Reverse switch checkbox input</label
      >
    </div>
  </body>
</html>
