<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js">
    </script>
</head>

<body>
    <h1>test</h1>
    <p>aqui</p>
    <button id="hide">esconde</button>
    <button id="show">mostra</button>
    <button id="toggle">alternar</button>
    <br>
    <br>
    <br>
    <button id="fadein">surgir</button>

    <button id="fadetoggle">alternando</button>
    <button id="fadeto">Opacidade</button>
    <br>
    <br>
    <br>
    <button id="flipdown">desliza para baixo</button>
    <button id="flipup">desliza para cima</button>
    <button id="fliptoggle">desliza alternando</button>
    <div id="panel">
      Lorem ipsum dolor sit amet, consectetur adipiscing elit,
      sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
      Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi
      ut aliquip ex ea commodo consequat.
    </div>

    <div id="div1">
      <p>surgindo</p>
    </div>
    <div id="div2">
      <p>surgindo lentamente</p>
    </div>
    <div id="div3">
      <p>surgindo em 3sec</p>

    <button id="fadeout">desaparecendo</button>

    <script>
        $('#panel').hide();
        $('#div1').hide();
        $('#div2').hide();
        $('#div3').hide();

        $('h1').on('click', function() {
          $(this).hide();
        });

        $('p').on({
          mouseenter: function(){
            $(this).css('background-color', 'lightgray');
          },
          mouseleave: function(){
            $(this).css('background-color', 'lightblue');
          },
          click: function(){
            $(this).css('background-color', 'yellow');
          }
        });

        $('#hide').click(function(){
          $('p').hide();
        });

        $('#show').click(function(){
          $('p').show(5000, window.alert("Hello world!"))
        });

        $('#toggle').click(()=> {
          $('p').toggle();
        });

        $('#fadein').click(()=> {
          $('#div1').fadeIn();
          $('#div2').fadeIn('slow')
          $('#div3').fadeIn(3000);
        });

        $('#fadeout').click(()=> {
          $('#div1').fadeOut();
          $('#div2').fadeOut('slow')
          $('#div3').fadeOut(3000);
        });

        $('#fadetoggle').click(()=> {
          $('#div1').fadeToggle();
          $('#div2').fadeToggle('slow')
          $('#div3').fadeToggle(3000);
        });

        $('#fadeto').click(()=> {
          $('#div1').fadeTo('slow', 0.15);
          $('#div2').fadeTo('slow', 0.4);
          $('#div3').fadeTo('slow', 0.7);
        });

        $('#flipdown').click(() => {
          $('#panel').slideDown();
        });

        $('#flipup').click(() => {
          $('#panel').slideUp();
        });

        $('#fliptoggle').click(() => {
          $('#panel').slideToggle();
        });
    </script>
</body>

</html>
